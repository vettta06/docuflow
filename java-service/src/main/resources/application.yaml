spring:
  application:
    name: accounting-platform
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:accounting}
    username: ${POSTGRES_USER:accounting}
    password: ${POSTGRES_PASSWORD:accounting}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
