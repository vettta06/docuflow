spring:
  application:
    name: accounting-platform
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:accounting}
    username: ${POSTGRES_USER:accounting}
    password: ${POSTGRES_PASSWORD:accounting}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change_me_please_this_is_not_secure_use_env_var_in_production_minimum_32_chars}
  expiration-ms: 3600000

bootstrap:
  manager:
    email: ${BOOTSTRAP_MANAGER_EMAIL:manager@platform.local}
    password: ${BOOTSTRAP_MANAGER_PASSWORD:admin12345}
    full-name: ${BOOTSTRAP_MANAGER_FULL_NAME:Platform Manager}
