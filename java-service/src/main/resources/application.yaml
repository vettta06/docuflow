spring:
  application:
    name: accounting-platform
  datasource:
    url: jdbc:postgresql://localhost:5433/${POSTGRES_DB:accounting}
    username: ${POSTGRES_USER:accounting}
    password: ${POSTGRES_PASSWORD:accounting}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:change_me_please_this_is_not_secure_use_env_var_in_production_minimum_32_chars}
  expiration-ms: 3600000

bootstrap:
  manager:
    email: ${BOOTSTRAP_MANAGER_EMAIL:manager@platform.local}
    password: ${BOOTSTRAP_MANAGER_PASSWORD:admin12345}
    full-name: ${BOOTSTRAP_MANAGER_FULL_NAME:Platform Manager}

storage:
  upload-dir: ${UPLOAD_DIR:../uploads}
  allowed-mime-types:
    - application/pdf
    - image/jpeg
    - image/png
    - image/tiff
  max-file-size-bytes: ${MAX_FILE_SIZE_BYTES:20971520}

minio:
  endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:documents}
